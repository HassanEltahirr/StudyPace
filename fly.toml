app = "studypace"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  STUDYPACE_ENV = "production"
  STUDYPACE_LOCAL_ADMIN_ENABLED = "false"
  STUDYPACE_PRACTICE_ENABLED = "false"
  STUDYPACE_DATA_DIR = "/app/backend/data"
  STUDYPACE_STATIC_DIR = "/app/frontend-dist"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 150

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
